<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Máy chiếu · Ngày Phụ Nữ</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/css/host.css">
</head>
<body>
  <section id="scr-lobby" class="screen on">
    <div class="lobby-top">
      <div class="lobby-side">
        <h1>MỞ ĐIỆN THOẠI<br>VÀO PHÒNG</h1>
        <p class="lobby-hint">Trên điện thoại, gõ địa chỉ này:</p>
        <p class="lobby-url"><b id="origin">...</b></p>
        <p class="join-count">Đã vào phòng: <b id="joined">0</b>/<b id="max-slots">12</b></p>
      </div>
    </div>
    <div id="slots" class="slots"></div>
    <div class="lobby-actions">
      <button id="btn-start" class="big-btn" disabled>BẮT ĐẦU</button>
    </div>
  </section>

  <section id="scr-countdown" class="screen">
    <div id="count-num" class="count-num"></div>
  </section>

  <section id="scr-race" class="screen">
    <div class="race-head">
      <span>ĐANG ĐUA</span>
      <span id="race-progress">0 / 12 đã về đích</span>
      <button id="btn-force" class="small-btn">Đánh dấu về đích</button>
    </div>
    <div id="lanes" class="lanes"></div>
  </section>

  <section id="scr-board" class="screen">
    <h1 class="board-title">BẢNG XẾP HẠNG</h1>
    <p class="board-sub">TIER 1 · 3 người đầu &nbsp;|&nbsp; TIER 2 · 4 người kế tiếp &nbsp;|&nbsp; TIER 3 · 5 người còn lại</p>
    <div id="rows" class="rows"></div>
    <div class="board-actions">
      <button id="btn-replay" class="big-btn">CHƠI LẠI</button>
    </div>
  </section>

  <div id="offline" class="offline-bar">Mất kết nối với máy chủ — đang thử lại…</div>
  <div id="confetti" class="confetti"></div>
  <div id="fx-flash" class="fx-flash"></div>

  <script type="module" src="/js/host.js"></script>
</body>
</html>
