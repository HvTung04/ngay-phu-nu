<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Máy chiếu · Ngày Phụ Nữ</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/css/host.css">
</head>
<body>
  <section id="scr-arena" class="screen on">
    <div class="arena-head">
      <span id="phase-label" class="phase">CHỜ NGƯỜI CHƠI</span>
      <span class="arena-center">
        <span id="join-info" class="join-info">Vào: <b id="origin">...</b></span>
        <span id="race-clock" class="race-clock" hidden>1:30</span>
        <span id="race-progress" class="race-progress" hidden>0 / 0 đã về đích</span>
      </span>
      <span class="arena-actions">
        <button id="btn-start" class="big-btn">BẮT ĐẦU</button>
      </span>
    </div>
    <div id="lanes" class="lanes"></div>
    <div id="count-overlay" class="count-overlay"><span id="count-num" class="count-num"></span></div>
  </section>

  <section id="scr-board" class="screen">
    <h1 class="board-title">BẢNG XẾP HẠNG</h1>
    <div id="rows" class="rows"></div>
    <div class="board-actions">
      <button id="btn-replay" class="big-btn">CHƠI LẠI</button>
    </div>
  </section>

  <div id="offline" class="offline-bar">Mất kết nối với máy chủ — đang thử lại…</div>
  <div id="confetti" class="confetti"></div>
  <div id="fx-flash" class="fx-flash"></div>

  <script type="module" src="/js/host.js"></script>
</body>
</html>
